# Release guard — runs on PRs targeting master (release PRs from develop).
# Enforces the plugin-versioning rule's release-time invariants:
#   1. no prerelease (-dev.*) version string reaches master;
#   2. every plugin changed since master carries a version bump;
#   3. a bumped plugin's changelog names that version at its top;
#   4. no Unreleased section survives the release.
name: release-guard

on:
  pull_request:
    branches: [master]

jobs:
  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No prerelease versions reach master
        run: |
          fail=0
          for m in plugins/*/.claude-plugin/plugin.json; do
            v=$(jq -r .version "$m")
            case "$v" in
              *-*)
                echo "::error file=$m::prerelease version '$v' must not reach master — strip the -dev suffix and size the final bump"
                fail=1
                ;;
            esac
          done
          exit $fail

      - name: A bumped plugin's changelog names the new version
        run: |
          base="origin/${{ github.base_ref }}"
          fail=0
          for d in plugins/*/; do
            name=$(basename "$d")
            manifest="${d}.claude-plugin/plugin.json"
            head_v=$(jq -r .version "$manifest")
            base_v=$(git show "$base:$manifest" 2>/dev/null | jq -r .version || echo "<absent>")
            if [ "$base_v" = "$head_v" ]; then continue; fi
            changelog="${d}CHANGELOG.md"
            if [ ! -f "$changelog" ]; then
              echo "::error file=$manifest::plugin '$name' moved to '$head_v' but ships no CHANGELOG.md"
              fail=1
              continue
            fi
            top=$(grep -m1 '^## ' "$changelog" || true)
            escaped=$(printf '%s' "$head_v" | sed 's/[.]/\\./g')
            if ! printf '%s\n' "$top" | grep -qE "^## $escaped — [0-9]{4}-[0-9]{2}-[0-9]{2}$"; then
              echo "::error file=$changelog::plugin '$name' moved to '$head_v' but its top heading reads '$top' — expected '## $head_v — <YYYY-MM-DD>'"
              fail=1
            fi
          done
          exit $fail

      - name: No Unreleased section reaches master
        run: |
          fail=0
          for f in plugins/*/CHANGELOG.md; do
            [ -f "$f" ] || continue
            if grep -q '^## Unreleased' "$f"; then
              echo "::error file=$f::rename the Unreleased heading to the minted version before releasing"
              fail=1
            fi
          done
          exit $fail

      - name: Changed plugins carry a bump
        run: |
          base="origin/${{ github.base_ref }}"
          fail=0
          for d in plugins/*/; do
            name=$(basename "$d")
            manifest="${d}.claude-plugin/plugin.json"
            if ! git diff --quiet "$base"...HEAD -- "$d"; then
              base_v=$(git show "$base:$manifest" 2>/dev/null | jq -r .version || echo "<absent>")
              head_v=$(jq -r .version "$manifest")
              if [ "$base_v" = "$head_v" ]; then
                echo "::error file=$manifest::plugin '$name' changed since master but version stayed '$head_v' — the release PR must bump it"
                fail=1
              fi
            fi
          done
          exit $fail
